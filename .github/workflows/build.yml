name: Test, Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']          # pushing a tag like v2.0.0 publishes a GitHub Release
  pull_request:
  workflow_dispatch:      # manual run from the Actions tab (builds, no release)

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  build:
    needs: test
    # build on tags and manual runs only (not every push)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: PixPress-${{ matrix.os }}
          path: dist/PixPress-*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/PixPress-*
          generate_release_notes: true
          body: |
            ## Download
            | Your computer | File |
            |---|---|
            | **Windows** | `PixPress-Windows-x64.exe` |
            | **Mac (Apple Silicon – M1/M2/M3/M4)** | `PixPress-macOS-arm64.dmg` |
            | **Mac (Intel)** | `PixPress-macOS-x64.dmg` |
            | **Linux** | `PixPress-Linux-x64` |

            **First launch:** Windows may show *"Windows protected your PC"* → click **More info → Run anyway**.
            On Mac, open the .dmg, drag PixPress to Applications, then the first time right-click it → **Open**
            (or System Settings → Privacy & Security → **Open Anyway**).
